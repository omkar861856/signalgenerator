version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signal-generator-app
    restart: always
    ports:
      - "3005:3005"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      vectorbt-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/signalgenerator
      - REDIS_URL=redis://redis:6379
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
      - OpenAiApiKey=${OpenAiApiKey}
      - GRAFANA_HOST=grafana
      - PROMETHEUS_HOST=prometheus
      - ALERTMANAGER_HOST=alertmanager

  vectorbt-service:
    build:
      context: ./scratch/vectorbt
      dockerfile: Dockerfile
    container_name: signal-generator-vectorbt
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  quant-engine:
    build:
      context: ./quant-engine
      dockerfile: Dockerfile
    container_name: signal-generator-quant-engine
    restart: always
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:6.0
    container_name: signal-generator-mongodb
    restart: always
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: signal-generator-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: signal-generator-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: --config.file=/etc/prometheus/prometheus.yml --web.external-url=/prometheus/ --web.route-prefix=/

  grafana:
    image: grafana/grafana:latest
    container_name: signal-generator-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true

  loki:
    image: grafana/loki:latest
    container_name: signal-generator-loki
    restart: always
    ports:
      - "127.0.0.1:3100:3100"

  promtail:
    image: grafana/promtail:latest
    container_name: signal-generator-promtail
    restart: always
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml

  alertmanager:
    image: prom/alertmanager:latest
    container_name: signal-generator-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command: --config.file=/etc/alertmanager/alertmanager.yml --web.external-url=http://localhost:9093/alertmanager/ --web.route-prefix=/

volumes:
  mongodb_data:
  redis_data:

networks:
  default:
    name: medusa_default
    external: true

